name: Scrape Great Clips Coupons

concurrency:
  group: coupon-content-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: America/Phoenix

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.revision.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests tweepy
          playwright install chromium
          playwright install-deps chromium

      - name: Test coupon pipeline before scraping
        run: |
          python -m unittest discover -s tests -p 'test_coupon*.py'
          python scripts/inject_local_links.py --check

      - name: Run scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

      - name: Generate website
        run: |
          python generate_website.py
          python scripts/ensure_static_root_files.py

      # Refreshes docs/data/coupons.json, which the per-city salon pages read in
      # the browser for the live coupon list.
      - name: Publish coupon feed for city pages
        run: python scripts/export_coupon_feed.py

      # The nationwide offer is baked into every city page as static HTML and
      # schema.org Offer markup, because crawlers that skip JavaScript - most AI
      # crawlers included - never see the client-side list. Regenerating keeps that
      # copy honest. Output is deterministic, so git only sees a diff when the
      # nationwide offer actually changes; the offer code is not baked in, so a
      # reissued code alone does not rewrite 2,550 files.
      - name: Rebuild city pages for the current nationwide offer
        run: python generate_local_pages.py

      # Keeps titles on the current month, re-applies real salon counts, and syncs
      # the foo/index.html duplicates. ensure_static runs last so it copies the
      # finished pages rather than a half-updated set.
      - name: Refresh local links, months and duplicate pages
        run: |
          python scripts/inject_local_links.py
          python generate_monthly_pages.py
          python scripts/ensure_static_root_files.py
          python scripts/audit_coupon_pipeline.py --report "$RUNNER_TEMP/coupon-audit.json"

      - name: Commit and push changes (race-safe)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- data docs
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            # Keep the fresh scan even if pulling a concurrent manual edit causes
            # a stash conflict. Generated pages can be rebuilt; the scan cannot.
            cp data/coupons.json "$RUNNER_TEMP/scraped-coupons.json"
            git stash
            git pull --rebase origin main
            # A bare `git stash pop || true` used to swallow conflicts here, which
            # committed literal "<<<<<<< Updated upstream" markers into 59 pages and
            # dropped the AdSense tag from 119 more. Everything under docs/ is
            # regenerated a few lines below, so on conflict keep the freshly pulled
            # upstream copy and let the generators rebuild - never leave markers.
            if ! git stash pop; then
              echo "::warning::stash pop conflicted; keeping upstream and regenerating"
              git checkout --ours -- . || true
              git reset || true
              git stash drop || true
            fi
            cp "$RUNNER_TEMP/scraped-coupons.json" data/coupons.json
            # Rebuild in dependency order after the pull: pages first, then the
            # post-processing that depends on them, then the sitemap last so it
            # reflects whatever ended up on disk.
            python generate_website.py
            python scripts/export_coupon_feed.py
            python generate_local_pages.py
            python scripts/inject_local_links.py
            python generate_monthly_pages.py
            python scripts/ensure_static_root_files.py
            python scripts/audit_coupon_pipeline.py --report "$RUNNER_TEMP/coupon-audit.json"
            python update_sitemap.py
            # Refuse to publish conflict markers, whatever their source.
            python scripts/check_conflict_markers.py
            git add -A -- data docs
            git commit -m "🔄 Update coupons $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        id: commit

      - name: Record the tested content revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Save pipeline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupon-pipeline-audit
          path: ${{ runner.temp }}/coupon-audit.json
          if-no-files-found: ignore

      - name: Summarize scrape result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          CONTENT_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          printf '### Coupon pipeline: %s\n\n' "$JOB_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$CONTENT_SHA" ]; then
            printf 'Content revision: `%s`\n' "$CONTENT_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No deployable revision was produced. Review the failed step above.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.scrape.outputs.commit_sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Google retired its sitemap-ping endpoint in 2023; Google now discovers updates
      # via the sitemap registered in Search Console. IndexNow covers Bing/Yandex/etc.
      # Replaces a hardcoded four-URL curl: the sitemaps now hold 2,715 URLs, so the
      # hub pages and both sitemaps are submitted and Bing pulls the rest from them.
      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        if: always()
        run: python3 scripts/indexnow_submit.py --core

      - name: Summarize deployment result
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          CONTENT_SHA: ${{ needs.scrape.outputs.commit_sha }}
        run: |
          printf '### Pages deployment: %s\n\nRevision: `%s`\n' "$JOB_RESULT" "$CONTENT_SHA" >> "$GITHUB_STEP_SUMMARY"
