name: Post to Buffer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  # Run 3 times per day to spread out posts (9 AM, 3 PM, 8 PM Phoenix time)
  schedule:
    - cron: '0 16 * * *'  # 9 AM Phoenix (4 PM UTC)
    - cron: '0 22 * * *'  # 3 PM Phoenix (10 PM UTC)
    - cron: '0 3 * * *'   # 8 PM Phoenix (3 AM UTC next day)
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      max_posts:
        description: 'Maximum coupons to post'
        required: false
        default: '1'
      dry_run:
        description: 'Preview tweets without posting'
        required: false
        type: boolean
        default: false

env:
  TZ: America/Phoenix
  WEBSITE_URL: https://greatclipsdeal.com

permissions:
  contents: write

jobs:
  post-buffer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy requests
      
      - name: Queue post in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.Buffer }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || '1' }}
          TWITTER_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          POST_PROVIDER: buffer
        run: python twitter_poster.py
      
      - name: Commit posted tracking file
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main || true
          git add data/posted_tweets.json || true
          git diff --staged --quiet || git commit -m "Update posted tweets $(date +'%Y-%m-%d %H:%M')"
          git push origin main || true
