name: Create YouTube videos

on:
  schedule:
    - cron: '30 16 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: Video type (local creates one new geographic offer video)
        type: choice
        default: local
        options:
          - auto
          - guide
          - deals
          - local

permissions:
  contents: write

concurrency:
  group: youtube-video-production
  cancel-in-progress: false

jobs:
  create:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install video dependencies
        run: python -m pip install -r video/requirements.txt
      - name: Test planning and offer safeguards
        run: python -m unittest discover -s video/tests -v
      - name: Restore narration cache
        uses: actions/cache@v4
        with:
          path: .cache/video-voice
          key: video-voice-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: video-voice-v2-${{ runner.os }}-
      - name: Cache local neural speech model
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-7d5df8ec-${{ runner.os }}
      - name: Generate the video package
        env:
          VIDEO_MODE: ${{ inputs.mode || 'local' }}
          UPLOAD_ENABLED: ${{ vars.YOUTUBE_UPLOAD_ENABLED }}
          UPLOAD_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          $videoArgs = @('-m', 'video', '--mode', $env:VIDEO_MODE, '--voice-provider', 'kokoro')
          if ($env:UPLOAD_ENABLED -eq 'true') {
            if (-not $env:YOUTUBE_TOKEN_JSON) { throw 'Set the YOUTUBE_TOKEN_JSON secret before enabling upload.' }
            $videoArgs += @('--upload', '--privacy', $env:UPLOAD_PRIVACY)
          }
          python @videoArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the downloadable video package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-package-${{ github.run_number }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            output/videos/run.json
            output/videos/*/video.mp4
            output/videos/*/thumbnail.jpg
            output/videos/*/thumbnail.source.json
            output/videos/*/captions.srt
            output/videos/*/description.txt
            output/videos/*/script.txt
            output/videos/*/youtube.json
            output/videos/*/plan.json
            output/videos/*/timeline.json
            output/videos/*/youtube-receipt.json
      - name: Persist creation history (including incomplete upload attempts)
        if: always()
        run: |
          if (-not (Test-Path data/video-state.json)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- data/video-state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Record automated video creation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 0; $attempt -lt 3; $attempt++) {
            git pull --rebase origin $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Creation history needs reconciliation; stopping to preserve it.' }
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -eq 0) { exit 0 }
          }
          throw 'Could not persist video history. Download the artifact before retrying.'
